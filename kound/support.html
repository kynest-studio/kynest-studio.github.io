<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>Support - Kynest Studio</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="icon" href="../images/kynest_logo.png" />
    <style>
        /* Tally form container height adjustment */
        .tally-container {
            margin-top: 2em;
            min-height: 500px;
        }
    </style>
</head>
<body class="is-preload">

<!-- Header -->
<header id="header">
    <div class="inner">
        <a href="index.html" class="image avatar"><img src="../images/kynest_logo.png" alt="Kynest Studio Logo" /></a>
        <h1><strong>Kynest Studio</strong></h1>
    </div>
</header>

<!-- Main -->
<div id="main">
    <section id="one">
        <header class="major">
            <h2>Support & Feedback</h2>
            <p>Have a question, a bug report, or a suggestion? Please fill out the form below. We will get back to you as soon as possible via the email address you provide.</p>
        </header>

        <div class="tally-container">
            <!-- Tally Embed Code -->
            <iframe
                    data-tally-src="https://tally.so/embed/9q2WBY?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
                    loading="lazy"
                    width="100%"
                    height="500"
                    title="Support Form">
            </iframe>
        </div>

        <hr />
    </section>
</div>

<!-- Footer -->
<footer id="footer">
    <div class="inner">
        <ul class="copyright">
            <li>&copy; 2026 Kynest Studio. All rights reserved.</li>
        </ul>
    </div>
</footer>

<!-- Scripts -->
<script src="../assets/js/jquery.min.js"></script>
<script src="../assets/js/browser.min.js"></script>
<script src="../assets/js/breakpoints.min.js"></script>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/main.js"></script>

<!-- Tally Embed Script -->
<script>
    var d = document, w = "https://tally.so/widgets/embed.js";
    var v = function() {
        if (typeof Tally !== "undefined") {
            Tally.loadEmbeds();
        } else {
            d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function(e) {
                e.src = e.dataset.tallySrc;
            });
        }
    };
    if (typeof Tally !== "undefined") {
        v();
    } else if (d.querySelector('script[src="' + w + '"]') == null) {
        var s = d.createElement("script");
        s.src = w;
        s.onload = v;
        s.onerror = v;
        d.body.appendChild(s);
    }
</script>

</body>
</html>
